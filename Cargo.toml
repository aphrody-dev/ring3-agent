[package]
name = "ring3-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Ring-3 Sovereign Local AI Agent, Boot HTTP + Tri-Backend Inference & Windows GPU-Diet Daemon"

[[bin]]
name = "r3d"
path = "src/main.rs"

[lib]
name = "ring3_agent"
path = "src/lib.rs"

[dependencies]
argh = "0.1.13"
zerocopy = { version = "0.8.20", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.20"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59.0"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_Security",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
